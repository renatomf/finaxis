# Version catalog for the rails simulator: https://docs.gradle.org/current/userguide/version_catalogs.html
# Gradle loads this file automatically and exposes it to build scripts as `libs`.
# Every version used by the build is declared here, and only here. The
# simulator shares no build files with the core (rails simulator design,
# section 8.1), so the two catalogs are kept current separately.

[versions]
java = "25"
spring-boot = "4.1.2"
archunit = "1.5.1"
spotless = "8.11.0"
palantir-java-format = "2.103.0"
errorprone-plugin = "5.2.0"
errorprone = "2.53.0"
nullaway = "0.14.4"
jqwik = "1.10.2"
json-schema-validator = "3.0.9"

[libraries]
# Bill of materials: the versions Spring Boot has tested together. Libraries
# managed by it are declared below without a version.
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
# Spring MVC on an embedded Tomcat server; includes the base Spring Boot starter.
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
# Production-ready endpoints (health, info, metrics) under /actuator.
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
# Spring Security: a chain of servlet filters that authenticates and authorizes every request.
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
# JDBC access with the HikariCP connection pool; adds a database health check.
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
# PostgreSQL JDBC driver.
postgresql = { module = "org.postgresql:postgresql" }
# Versioned database migrations, applied by Flyway when the service starts.
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
# Flyway's PostgreSQL support, a separate module since Flyway 10.
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
# Nullness annotations (@NullMarked, @Nullable), the standard Spring itself uses.
jspecify = { module = "org.jspecify:jspecify" }
# Test toolkit: JUnit Jupiter (JUnit 6), AssertJ, Mockito and Spring's test support.
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# MockMvc support for testing Spring MVC endpoints without a real server.
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
# Spring Security test support: MockMvc integration and mock users (@WithMockUser).
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
# Runs Testcontainers-managed containers as Spring beans; @ServiceConnection
# points Spring Boot at them instead of at configured URLs.
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
# Throwaway PostgreSQL containers for tests, started through Docker.
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
# Property-based testing: generates hundreds of inputs per test and shrinks a
# failure to the smallest input that still breaks the property. A JUnit Platform
# engine, so its tests run next to the JUnit Jupiter ones.
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
# Waits in tests for a condition that work on another thread makes true,
# polling until it holds or a timeout fails the test.
awaitility = { module = "org.awaitility:awaitility" }
# JSON Schema validation (draft 2020-12, the dialect of OpenAPI 3.1), to check
# the simulator's messages against openapi/rails.yaml.
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
# Reads the YAML contract; version from Spring Boot's bill of materials.
jackson-dataformat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }
# Architecture rules written as unit tests.
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
# Lets Gradle launch JUnit tests; Gradle 9 requires it on the test runtime classpath.
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# Static analysis that runs inside javac and reports common Java bug patterns.
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
# Error Prone check that proves, at compile time, that no null is dereferenced.
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

[plugins]
# Code formatter: `spotlessCheck` fails the build on unformatted code, `spotlessApply` fixes it.
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
# Plugs Error Prone into every Java compile task.
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
